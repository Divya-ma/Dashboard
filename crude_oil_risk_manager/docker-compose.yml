services:
  crude-oil-risk-manager:
    build: .
    container_name: crude-oil-risk-manager
    ports:
      - "8050:8050"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
      - ./db:/app/db
    restart: always
    stop_grace_period: 30s  # lets a running backup or file write finish
