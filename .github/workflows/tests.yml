name: tests

on:
  push:
    branches: [main]
  pull_request:

# The dashboard lives in crude_oil_risk_manager/ inside this repository.
defaults:
  run:
    working-directory: crude_oil_risk_manager

jobs:
  test:
    name: tests (${{ matrix.os }}, python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }   # what the Dockerfile runs
          - { os: windows-latest, python: "3.13" }  # what the dashboard runs on at the desk (DPAPI secrets, London time zone data)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            crude_oil_risk_manager/requirements.txt
            crude_oil_risk_manager/requirements-dev.txt
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (blocking rules from pyproject.toml)
        run: python -m ruff check .
      - name: Lint (unused code, informational)
        run: python -m ruff check . --select F401,F811,F841 --exit-zero
      - name: Type check (informational)
        run: python -m mypy || true
        shell: bash
      - name: Tests
        run: python -m pytest -q
